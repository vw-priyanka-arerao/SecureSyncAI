services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securesync
      POSTGRES_USER: securesync
      POSTGRES_PASSWORD: securesync
    ports:
      - '5432:5432'
    volumes:
      - securesync-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U securesync -d securesync']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/securesync
      DB_USERNAME: securesync
      DB_PASSWORD: securesync
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  securesync-postgres-data:

